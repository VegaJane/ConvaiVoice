<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show Riley a picture</title>
<style>body{font:18px system-ui;background:#f3f0fa;color:#252035;margin:40px auto;padding:20px;max-width:580px}main{background:white;padding:28px;border-radius:20px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:8px 0 18px}button{background:#6545a4;color:white;border:0;border-radius:9px;cursor:pointer}img{max-width:100%;max-height:300px}label{display:block}#status{white-space:pre-wrap}</style>
<main><h1>Show Riley a picture</h1><p>Take a snip, then paste it here with Ctrl+V, or choose a picture file.</p><label>Upload code<input id="code" type="password" autocomplete="off"></label><label>Your SL name<input id="name" maxlength="80"></label><label>Picture<input id="file" type="file" accept="image/png,image/jpeg"></label><img id="preview" alt="" hidden><label>Ask Riley<textarea id="question" maxlength="700" placeholder="What do you think of this picture?"></textarea></label><button id="send">Send to Riley</button><p id="status" role="status"></p><small>Your picture is temporarily held for up to 30 minutes. It is lost if the server restarts. Her reply is spoken in Second Life.</small></main>
<script>
const el=id=>document.getElementById(id);let picture='';let loading=false;
async function load(file){picture='';el('preview').hidden=true;if(!file||!['image/png','image/jpeg'].includes(file.type)){el('status').textContent='Choose a PNG or JPEG.';return;}if(file.size>20000000){el('status').textContent='Please choose a picture under 20 MB.';return;}loading=true;el('status').textContent='Preparing picture…';try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,1280/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();picture=canvas.toDataURL('image/jpeg',0.85);el('preview').src=picture;el('preview').hidden=false;el('status').textContent='Picture ready.';}catch{el('status').textContent='Could not open that picture.';}finally{loading=false;}}
el('file').onchange=e=>load(e.target.files[0]);document.addEventListener('paste',e=>{const item=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();load(item.getAsFile());}});
el('send').onclick=async()=>{if(loading||!picture||!el('name').value.trim()||!el('code').value){el('status').textContent='Enter your name, upload code, and a picture first.';return;}el('send').disabled=true;el('status').textContent='Sending… The server may need a minute to wake up.';try{const r=await fetch('/snapshots/send',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+el('code').value},body:JSON.stringify({name:el('name').value,question:el('question').value,image:picture})});const body=await r.json();if(!r.ok)throw new Error(body.error||'Upload failed.');el('status').textContent=body.message;}catch(e){el('status').textContent=e.message;}finally{el('send').disabled=false;}};
</script></html>
